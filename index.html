<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICG Studio – Intermediate Code Generator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef1f6;--pn:#fff;--p2:#f6f8fb;--bd:#dfe4ec;--fg:#1d2433;--mut:#6a7487;--ac:#4f46e5;--ac2:#0e7490;--ok:#15803d;--bad:#dc2626;--warn:#b45309;--cons:#0f172a;--consfg:#d6e2f5;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0b0f17;--pn:#121826;--p2:#0e1420;--bd:#232c3f;--fg:#e6ebf5;--mut:#8b96ad;--ac:#818cf8;--ac2:#22d3ee;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--cons:#070a11;--consfg:#cfe0ff}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b0f17;--pn:#121826;--p2:#0e1420;--bd:#232c3f;--fg:#e6ebf5;--mut:#8b96ad;--ac:#818cf8;--ac2:#22d3ee;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--cons:#070a11;--consfg:#cfe0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.top{max-width:1280px;margin:0 auto;padding:16px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.brand{display:flex;gap:12px;align-items:center;margin-right:auto}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font:600 15px var(--mono)}
.brand b{display:block;font-size:17px;letter-spacing:-.2px}.brand small{color:var(--mut);font-size:12px}
.pipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ar{color:var(--mut)}
.chip{display:flex;gap:7px;align-items:center;padding:5px 12px;border:1px solid var(--bd);border-radius:99px;background:var(--pn);font-size:12px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--bd)}.chip small{color:var(--mut)}
.chip.ok i{background:var(--ok)}.chip.bad{border-color:var(--bad)}.chip.bad i{background:var(--bad)}.chip.bad small{color:var(--bad)}
.ghost{background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:9px;width:36px;height:36px;font-size:16px;cursor:pointer}
.ws{max-width:1280px;margin:0 auto;padding:8px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
@media(max-width:860px){.ws{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--pn);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 30px rgba(15,23,42,.07);display:flex;flex-direction:column;height:min(74vh,700px);min-height:440px;overflow:hidden}
.ph,.pf{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--p2);font-size:12.5px;color:var(--mut)}
.ph{border-bottom:1px solid var(--bd)}.pf{border-top:1px solid var(--bd);justify-content:space-between}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.ph select{margin-left:auto;font:inherit;background:var(--pn);color:var(--fg);border:1px solid var(--bd);border-radius:7px;padding:3px 8px}
.ed{flex:1;min-height:0;display:flex;background:var(--p2)}
#gut{width:46px;padding:12px 8px 12px 0;text-align:right;color:var(--mut);font:13px/20px var(--mono);overflow:hidden;border-right:1px solid var(--bd);user-select:none}
#gut div.er{background:rgba(220,38,38,.18);color:var(--bad);font-weight:600}
#src{flex:1;min-width:0;border:0;outline:0;resize:none;padding:12px 14px;background:transparent;color:var(--fg);font:13px/20px var(--mono);white-space:pre;overflow:auto}
#go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:9px;padding:8px 16px;font:600 13px Inter,sans-serif;cursor:pointer}
.sw{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--fg)}.sw input{display:none}
.sw span{width:34px;height:20px;border-radius:99px;background:var(--bd);position:relative;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--ac)}.sw input:checked+span::after{left:17px}
.tabs{display:flex;overflow-x:auto;background:var(--p2);border-bottom:1px solid var(--bd)}
.tabs button{flex:none;border:0;background:none;color:var(--mut);padding:11px 15px;font:500 13px Inter,sans-serif;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--fg);border-color:var(--ac);background:var(--pn)}
.tabs em{font-style:normal;font-size:11px;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--bd);color:var(--fg)}
.view{flex:1;overflow:auto;padding:14px}
.con{background:var(--cons);color:var(--consfg);border-radius:10px;padding:14px;font:13px/1.7 var(--mono)}
.con .pr{color:#7dd3fc;margin-bottom:6px}.con .ok{color:#4ade80;margin-top:8px}.con.bad{border:1px solid var(--bad)}.con.bad>div:nth-child(2){color:#fca5a5}.con .mut{color:#8b96ad}
.code{font:13px/1.75 var(--mono)}.ln{display:flex;gap:14px;padding:0 8px;border-radius:5px}.ln:hover{background:var(--p2)}
.ln.lb{color:var(--warn);font-weight:600;padding-left:36px;margin-top:4px}.ix{color:var(--mut);width:22px;display:inline-block}
.k{color:var(--ac);font-weight:600}.l{color:var(--warn)}.t{color:var(--ac2)}.n{color:var(--ok)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font:12.5px var(--mono)}
th{position:sticky;top:0;background:var(--p2);color:var(--mut);font:600 11px Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:8px 12px;border-bottom:1px solid var(--bd)}
td{padding:6px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:hover td{background:var(--p2)}table.idx td:first-child{color:var(--mut)}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="logo">&lt;/&gt;</div><div><b>ICG Studio</b><small>Intermediate Code Generator · Compiler Construction</small></div></div>
 <div class="pipe" id="pipe"></div>
 <button class="ghost" id="th" aria-label="Toggle theme">◐</button>
</header>
<main class="ws">
 <section class="pane">
  <div class="ph"><span class="dots"><i></i><i></i><i></i></span><span>source.src</span>
   <select id="smp" aria-label="Sample program"><option value="fact">Factorial · for</option><option value="gcd">GCD · while</option><option value="expr">Expressions · if/else</option></select></div>
  <div class="ed"><div id="gut" aria-hidden="true"></div><textarea id="src" spellcheck="false" aria-label="Source code"></textarea></div>
  <div class="pf"><label class="sw"><input type="checkbox" id="fold"><span></span>Constant folding</label><span id="pos"></span><button id="go">▶ Compile &amp; Run</button></div>
 </section>
 <section class="pane">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="view" id="view"></div>
  <div class="pf"><span id="stat"></span><span>Ctrl + Enter to run</span></div>
 </section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
class CE extends Error{}
const KW=new Set(['int','float','if','else','while','for','print']);
const RE=/(\/\/[^\n]*)|(\d+(?:\.\d+)?)|([A-Za-z_]\w*)|(==|!=|<=|>=|&&|\|\||[+\-*\/%<>=!])|([(){};,])|([ \t\r]+)|(\n)|(.)/g;
function tokenize(s){const T=[];let line=1,m;RE.lastIndex=0;
 while((m=RE.exec(s))){if(m[1]||m[6])continue;if(m[7]){line++;continue}
  if(m[8])throw new CE(`line ${line}: illegal character '${m[8]}'`);
  T.push([m[2]?'NUM':m[3]?(KW.has(m[3])?'KW':'ID'):m[4]?'OP':'PUNCT',m[0],line])}
 T.push(['EOF','',line]);return T}

function parse(T){let i=0;
 const pk=()=>T[i],nx=()=>T[i++];
 const at=v=>{const t=T[i];return t[1]===v&&(t[0]=='KW'||t[0]=='OP'||t[0]=='PUNCT')};
 const acc=v=>at(v)?nx():null;
 const ex=v=>{if(!at(v)){const t=pk();throw new CE(`line ${t[2]}: expected '${v}' but found '${t[1]||'end of input'}'`)}return nx()};
 const asg=()=>{const t=nx();if(t[0]!='ID')throw new CE(`line ${t[2]}: expected a variable name`);ex('=');return['assign',t[1],expr(),t[2]]};
 const bin=(sub,ops)=>()=>{let l=sub();while(pk()[0]=='OP'&&ops.includes(pk()[1])){const o=nx()[1];l=['bin',o,l,sub()]}return l};
 function pr(){const[k,v,l]=pk();
  if(k=='NUM'){nx();return['num',v]}
  if(k=='ID'){nx();return['var',v,l]}
  if(acc('(')){const e=expr();ex(')');return e}
  throw new CE(`line ${l}: unexpected token '${v||'end of input'}'`)}
 function un(){if(pk()[0]=='OP'&&(pk()[1]=='-'||pk()[1]=='!')){const o=nx()[1];return['un',o,un()]}return pr()}
 const mul=bin(un,['*','/','%']),add=bin(mul,['+','-']),rel=bin(add,['<','>','<=','>=']),eq=bin(rel,['==','!=']),and=bin(eq,['&&']),expr=bin(and,['||']);
 function stmt(){const[k,v,l]=pk();
  if(at('{')){nx();const b=[];while(!at('}')){if(pk()[0]=='EOF')throw new CE(`line ${pk()[2]}: missing '}'`);b.push(stmt())}nx();return['block',b]}
  if(k=='KW'&&(v=='int'||v=='float')){nx();const it=[];
   do{const t=nx();if(t[0]!='ID')throw new CE(`line ${t[2]}: expected a variable name in declaration`);it.push([t[1],acc('=')?expr():null,t[2]])}while(acc(','));
   ex(';');return['decl',v,it]}
  if(at('if')){nx();ex('(');const c=expr();ex(')');const t=stmt();return['if',c,t,acc('else')?stmt():null]}
  if(at('while')){nx();ex('(');const c=expr();ex(')');return['while',c,stmt()]}
  if(at('for')){nx();ex('(');const a=asg();ex(';');const c=expr();ex(';');const s=asg();ex(')');return['for',a,c,s,stmt()]}
  if(at('print')){nx();ex('(');const e=expr();ex(')');ex(';');return['print',e]}
  if(k=='ID'){const a=asg();ex(';');return a}
  throw new CE(`line ${l}: unexpected token '${v||'end of input'}'`)}
 const P=[];while(pk()[0]!='EOF')P.push(stmt());return P}

const isn=s=>s!==''&&!isNaN(+s);
const ap=(o,a,b)=>{if((o=='/'||o=='%')&&b===0)throw new CE('division by zero');const ii=Number.isInteger(a)&&Number.isInteger(b);
 switch(o){case'+':return a+b;case'-':return a-b;case'*':return a*b;case'/':return ii?Math.trunc(a/b):a/b;case'%':return a%b;
 case'<':return+(a<b);case'>':return+(a>b);case'<=':return+(a<=b);case'>=':return+(a>=b);case'==':return+(a==b);case'!=':return+(a!=b)}};

function gen(ast,fold){const Q=[],sym=Object.create(null);let tn=0,ln=0;
 const tmp=()=>'t'+(++tn),lab=()=>'L'+(++ln),em=(op,a1='',a2='',res='')=>Q.push({op,a1,a2,res});
 const dec=(n,t,l)=>{if(/^[tL]\d+$/.test(n))throw new CE(`line ${l}: '${n}' is reserved for compiler temporaries/labels`);if(n in sym)throw new CE(`line ${l}: '${n}' already declared`);sym[n]=t};
 const chk=(n,l)=>{if(!(n in sym))throw new CE(`line ${l}: '${n}' used before declaration`)};
 function lg(n){const e=lab(),l=ex(n[2]),t=tmp();em('!=',l,'0',t);em(n[1]=='&&'?'ifFalse':'ifTrue',t,'',e);const r=ex(n[3]);em('!=',r,'0',t);em('label','','',e);return t}
 function ex(n){const k=n[0];
  if(k=='num')return n[1];
  if(k=='var'){chk(n[1],n[2]);return n[1]}
  if(k=='un'){const v=ex(n[2]);if(fold&&isn(v)){const x=+v;return String(n[1]=='-'?-x:+!x)}const t=tmp();em(n[1]=='-'?'uminus':'!',v,'',t);return t}
  const o=n[1];if(o=='&&'||o=='||')return lg(n);
  const l=ex(n[2]),r=ex(n[3]);if(fold&&isn(l)&&isn(r))return String(ap(o,+l,+r));
  const t=tmp();em(o,l,r,t);return t}
 function st(n){const k=n[0];
  if(k=='block')n[1].forEach(st);
  else if(k=='decl')n[2].forEach(([nm,init,l])=>{dec(nm,n[1],l);if(init)em('=',ex(init),'',nm)});
  else if(k=='assign'){chk(n[1],n[3]);em('=',ex(n[2]),'',n[1])}
  else if(k=='print')em('print',ex(n[1]));
  else if(k=='if'){const c=ex(n[1]),le=lab(),ld=n[3]?lab():null;em('ifFalse',c,'',le);st(n[2]);if(n[3])em('goto','','',ld);em('label','','',le);if(n[3]){st(n[3]);em('label','','',ld)}}
  else if(k=='while'){const a=lab(),b=lab();em('label','','',a);em('ifFalse',ex(n[1]),'',b);st(n[2]);em('goto','','',a);em('label','','',b)}
  else if(k=='for'){st(n[1]);const a=lab(),b=lab();em('label','','',a);em('ifFalse',ex(n[2]),'',b);st(n[4]);st(n[3]);em('goto','','',a);em('label','','',b)}}
 ast.forEach(st);return{Q,sym}}

const fm=q=>{const{op,a1:a,a2:b,res:r}=q;return op=='label'?r+':':op=='goto'?`    goto ${r}`:op=='ifFalse'||op=='ifTrue'?`    ${op} ${a} goto ${r}`:op=='='?`    ${r} = ${a}`:op=='uminus'?`    ${r} = -${a}`:op=='!'?`    ${r} = !${a}`:op=='print'?`    print ${a}`:`    ${r} = ${a} ${op} ${b}`};
function rs(Q){const I=[],L={};Q.forEach(q=>{if(q.op=='label')L[q.res]=I.length;else I.push(q)});return[I,L]}
const JP=['goto','ifFalse','ifTrue'];
const qrows=Q=>{const[I,L]=rs(Q);return I.map((q,i)=>[i,q.op,q.a1||'-',q.a2||'-',JP.includes(q.op)?L[q.res]:q.res||'-'])};
const trows=Q=>{const[I,L]=rs(Q),T=Object.create(null),rf=x=>x in T?`(${T[x]})`:x||'-';
 return I.map((q,i)=>{const o=q.op;
  if(o=='=')return[i,o,q.res,rf(q.a1)];
  if(o=='goto')return[i,o,`(${L[q.res]})`,'-'];
  if(o=='ifFalse'||o=='ifTrue')return[i,o,rf(q.a1),`(${L[q.res]})`];
  if(o=='print')return[i,o,rf(q.a1),'-'];
  const r=[i,o,rf(q.a1),rf(q.a2)];T[q.res]=i;return r})};

function run(Q,sym){const[I,L]=rs(Q),env=Object.create(null),out=[];for(const n in sym)env[n]=0;
 let pc=0,steps=0;const v=x=>x in env?env[x]:+x;
 while(pc<I.length){if(++steps>1e6)throw new CE('execution aborted: too many steps (infinite loop?)');
  const{op,a1:a,a2:b,res:r}=I[pc++];
  if(op=='=')env[r]=sym[r]=='int'?Math.trunc(v(a)):v(a);
  else if(op=='goto')pc=L[r];
  else if(op=='ifFalse'){if(!v(a))pc=L[r]}
  else if(op=='ifTrue'){if(v(a))pc=L[r]}
  else if(op=='print')out.push(String(v(a)));
  else if(op=='uminus')env[r]=-v(a);
  else if(op=='!')env[r]=+!v(a);
  else env[r]=ap(op,v(a),v(b))}
 return out}

const SMP={
fact:`// factorial of n using a for loop
int n = 5, f = 1, i;
for (i = 1; i <= n; i = i + 1) {
    f = f * i;
}
print(f);`,
gcd:`// Euclid’s GCD using a while loop
int a = 48, b = 18, t;
while (b != 0) {
    t = b;
    b = a % b;
    a = t;
}
print(a);`,
expr:`// expressions, logical operators, if/else
int x = 10, y = 4, r, k = 2 * 3 + 4;
r = (x + y) * (x - y) / 2 + -x;
if (r > 50 && y != 0) {
    print(1);
} else {
    print(0);
}
print(r);
print(k);`};

const hl=s=>esc(s).replace(/\b(ifFalse|ifTrue|goto|print|uminus)\b/g,'<b class=k>$1</b>').replace(/\b(L\d+)\b/g,'<b class=l>$1</b>').replace(/\b(t\d+)\b/g,'<b class=t>$1</b>').replace(/(^|[\s=!&|<>+\-*\/%(])(\d+(?:\.\d+)?)\b/g,'$1<b class=n>$2</b>');
const tbl=(h,r,ix)=>`<div class="sc"><table class="${ix?'idx':''}"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(c=>`<td>${hl(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const TABS=[['out','Output'],['tac','TAC'],['quad','Quadruples'],['trip','Triples'],['sym','Symbols'],['tok','Tokens']],PH=['Lexer','Parser','Semantic + ICG','Execute'];
let tab='out',R=null,ER=null;
function gut(n){const c=$('src').value.split('\n').length;$('gut').innerHTML=Array.from({length:c},(_,i)=>`<div class="${i+1==n?'er':''}">${i+1}</div>`).join('');$('gut').scrollTop=$('src').scrollTop}
function pipe(p){const s=R?[`${R.n.tok} tokens`,`${R.st} statements`,`${R.n.tac} instr`,`${R.n.out} output`]:[];
 $('pipe').innerHTML=PH.map((h,i)=>`<div class="chip ${i<p?'ok':i==p?'bad':''}"><i></i><b>${h}</b><small>${i<p?(R?s[i]:'done'):i==p?'failed':'—'}</small></div>`).join('<span class="ar">›</span>')}
function draw(){
 $('tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" class="${k==tab?'on':''}" data-k="${k}">${l}${R?`<em>${R.n[k]}</em>`:''}</button>`).join('');
 const v=$('view');
 if(ER){v.innerHTML=`<div class="con bad"><div class="pr">$ icg compile source.src</div><div>✖ ${esc(ER.msg)}</div><div class="mut">Compilation stopped in the ${PH[ER.p].toLowerCase()} phase.</div></div>`;return}
 if(!R){v.innerHTML='<div class="con"><div class="pr">$ icg</div><div class="mut">Choose a sample or write your own code, then press ▶ Compile &amp; Run.</div></div>';return}const{Q,sym,T,out}=R;let c=0;
 v.innerHTML=tab=='out'?`<div class="con"><div class="pr">$ icg compile source.src --run</div>${out.length?out.map(o=>`<div>› ${esc(o)}</div>`).join(''):'<div class="mut">(no output)</div>'}<div class="ok">✔ process finished with exit code 0</div></div>`
 :tab=='tac'?`<div class="code">${Q.map(q=>q.op=='label'?`<div class="ln lb">${hl(fm(q))}</div>`:`<div class="ln"><span class="ix">${String(c++).padStart(2,'0')}</span><span>${hl(fm(q).trim())}</span></div>`).join('')}</div>`
 :tab=='quad'?tbl(['#','op','arg1','arg2','result'],qrows(Q),1)
 :tab=='trip'?tbl(['#','op','arg1','arg2'],trows(Q),1)
 :tab=='sym'?tbl(['name','type'],Object.entries(sym))
 :tbl(['kind','lexeme','line'],T.slice(0,-1))}
function go(){let p=0,m;const src=$('src').value;
 try{const T=tokenize(src);p=1;const A=parse(T);p=2;const{Q,sym}=gen(A,$('fold').checked);p=3;const out=run(Q,sym);
  const ni=Q.filter(q=>q.op!='label').length,tm=new Set(Q.map(q=>q.res).filter(r=>/^t\d+$/.test(r))).size;
  R={Q,sym,T,out,st:A.length,n:{out:out.length,tac:ni,quad:ni,trip:ni,sym:Object.keys(sym).length,tok:T.length-1}};ER=null;
  pipe(4);gut(0);$('stat').textContent=`✔ Compiled · ${ni} instructions · ${tm} temporaries`}
 catch(e){const msg=e instanceof CE?e.message:'Error: '+e.message;ER={msg,p};R=null;pipe(p);m=/line (\d+)/.exec(msg);gut(m?+m[1]:0);$('stat').textContent='✖ '+msg}
 draw()}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.k;draw()}};
$('smp').onchange=()=>{$('src').value=SMP[$('smp').value];R=ER=null;gut(0);cur();pipe(-1);draw();$('stat').textContent='Sample loaded. Press Compile & Run.'};
$('go').onclick=go;
$('src').onscroll=()=>$('gut').scrollTop=$('src').scrollTop;
const cur=()=>{const v=$('src').value.slice(0,$('src').selectionStart).split('\n');$('pos').textContent=`Ln ${v.length}, Col ${v[v.length-1].length+1}`};
$('src').oninput=()=>gut(0);
$('src').onkeyup=$('src').onclick=cur;
document.onkeydown=e=>{if(e.ctrlKey&&e.key=='Enter'){e.preventDefault();go()}};
$('th').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';r.dataset.theme=d?'light':'dark'};
$('src').value=SMP.fact;gut(0);cur();pipe(-1);draw();
</script>
</body>
</html>
